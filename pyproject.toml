[project]
name = "landcheck"
version = "0.1.0"
description = "Проверка подборки земельных участков по публичным данным НСПД: риск-флаги с объяснением и источником"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "pynspd>=1.1.15",
    "pydantic>=2.10",
    "shapely>=2.0.6",
    "openpyxl>=3.1.5",
    "typer>=0.15",
    "rich>=13",
    "socksio>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "itsdangerous>=2.2",
    "ddgs>=9",
    "trafilatura>=2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]
# Локальное распознавание речи на сервере (CPU): pip install ".[asr-local]"
asr-local = [
    "faster-whisper>=1.2",
]

[project.scripts]
landcheck = "landcheck.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["landcheck"]


[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"landcheck/rules/*" = ["E501"]  # тексты флагов не рвём ради длины строки
"landcheck/web/content.py" = ["E501"]
"landcheck/listing.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
