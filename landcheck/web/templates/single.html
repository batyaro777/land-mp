{% extends "base.html" %}
{% block content %}
<article class="narrow">
  <hgroup>
    <h2>Проверить один участок</h2>
    <p>Полный отчёт по кадастровому номеру: карточка, ЗОУИТ, территориальная зона, флаги, чек-лист.</p>
  </hgroup>
  <form method="post" action="/single">
    <label>Кадастровый номер<input name="cad_num" value="{{ cad_num or '' }}" placeholder="50:09:0060202:101" required autofocus></label>
    <label>Что хотите делать на участке
      <select name="purpose" id="purpose-select">{% for value, label in purposes %}<option value="{{ value }}" {{ 'selected' if value == purpose else '' }}>{{ label }}</option>{% endfor %}</select>
    </label>
    <label id="use-wrap" hidden>А после получения — что делать на участке
      <select name="use">{% for value, label in USES %}<option value="{{ value }}">{{ label }}</option>{% endfor %}</select>
    </label>
    <script>(function(){var p=document.getElementById('purpose-select'),w=document.getElementById('use-wrap');if(!p||!w)return;var pro={{ PRO_PURPOSES|tojson }};function f(){w.hidden=pro.indexOf(p.value)<0;}p.addEventListener('change',f);f();})();</script>
    <div class="grid">
      <label>Цена в объявлении, ₽<input name="price" placeholder="2 500 000"></label>
      <label>Площадь в объявлении, сот.<input name="area" placeholder="10"></label>
    </div>
    <button type="submit">Получить отчёт</button>
  </form>
</article>
{% endblock %}
