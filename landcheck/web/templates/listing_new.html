{% extends "base.html" %}
{% block content %}
<article class="narrow">
  <hgroup>
    <h2>Объявление из кадастра</h2>
    <p>Факты берём из НСПД, ваши заметки добавляем, противоречия с кадастром подсвечиваем. На выходе текст и XML для автозагрузки Avito.</p>
  </hgroup>
  <form method="post" action="/listing" enctype="multipart/form-data">
    <label>Кадастровый номер<input name="cad_num" value="{{ cad_num }}" placeholder="50:09:0060202:101" required></label>
    <label>Цена, ₽<input name="price" placeholder="2 500 000 или 2,5 млн"></label>
    <label>Тип участка для Avito
      <select name="object_type">
        <option value="">определить по НСПД</option>
        {% for key, label in object_types.items() %}<option value="{{ label }}">{{ label }}</option>{% endfor %}
      </select>
    </label>
    <label>Заметки продавца <small class="muted">(что есть на участке и рядом: свет, газ, дорога, лес, река, соседи — своими словами или расшифровка голосового)</small>
      <textarea name="notes" rows="6" placeholder="Электричество 15 кВт по границе, газ по улице, круглогодичный подъезд, рядом лес и река, до Истры 10 минут"></textarea>
    </label>
    <label>Фото участка <small class="muted">(jpg/png, до 10 штук, порядок как в файлах)</small>
      <input type="file" name="photos" accept=".jpg,.jpeg,.png,.webp" multiple>
    </label>
    <label>Телефон для объявления<input name="phone" placeholder="+7 900 000-00-00"></label>
    <button type="submit">Собрать объявление</button>
  </form>
</article>
{% endblock %}
